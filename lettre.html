<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La lettre · Ce Que Tu Manges</title>
<meta name="description" content="Une lettre, pas une alerte. Le code de la semaine, la preuve, et ce que tu peux faire lundi.">
<style>
  :root { --bg:#0c0d0b; --ink:#f4f1ea; --dim:#a39e93; --line:#2a2c28; --accent:#e7c56a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.5 Georgia, serif; }
  main { max-width:640px; margin:0 auto; padding:48px 20px 80px; }
  a { color:var(--accent); }
  .kicker { letter-spacing:.18em; text-transform:uppercase; font:12px/1.2 ui-sans-serif, system-ui, sans-serif; color:var(--accent); }
  h1 { font-weight:500; font-size:42px; line-height:1.05; margin:12px 0 16px; }
  p.lead { color:var(--dim); margin:0 0 28px; }
  form { display:grid; gap:12px; border-top:1px solid var(--line); padding-top:24px; }
  label { font:13px/1.3 ui-sans-serif, system-ui, sans-serif; color:var(--dim); }
  input[type=email] { width:100%; background:#141512; color:var(--ink); border:1px solid var(--line); padding:14px 12px; font:16px ui-sans-serif, system-ui, sans-serif; }
  .check { display:flex; gap:10px; align-items:flex-start; color:var(--dim); font:14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  button { background:var(--accent); color:#16140e; border:0; padding:14px 16px; font:14px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; }
  .note { color:var(--dim); font:13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  .ok { display:none; border:1px solid var(--line); padding:16px; }
</style>
</head>
<body>
<main>
  <p class="kicker">Ce Que Tu Manges</p>
  <h1>La lettre.</h1>
  <p class="lead">Un code. La preuve. Ce que tu peux faire lundi. Pas une alerte, pas une marque.</p>
  <form name="lettre" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/lettre-merci.html">
    <input type="hidden" name="form-name" value="lettre">
    <p hidden><label>Ne pas remplir <input name="bot-field"></label></p>
    <label for="email">Adresse</label>
    <input id="email" type="email" name="email" required autocomplete="email" placeholder="toi@mail.fr">
    <label class="check"><input type="checkbox" name="consent" required> J'accepte de recevoir la lettre CQTM. Je peux me désinscrire à chaque envoi. L'adresse sert uniquement à ça.</label>
    <button type="submit">Recevoir la lettre</button>
  </form>
  <p class="note">Envoi le dimanche. Expéditeur : cequetumanges@gmail.com. Aucune revente, aucun placement alimentaire.</p>
  <p class="note"><a href="https://cequetumanges.fr">Retour au fichier</a></p>
</main>
</body>
</html>
